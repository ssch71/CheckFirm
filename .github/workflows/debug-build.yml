name: Debug Build

on:
  push:
    branches: [ "**" ]
    paths-ignore: [ "**.md" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-${{ github.repository }}

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Create dummy keystore.properties
        run: |
          if [ ! -f keystore.properties ]; then
            cat > keystore.properties <<EOF
          storeFile=$HOME/.android/debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
          fi

      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "app/google-services.json already exists"
            exit 0
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Using GOOGLE_SERVICES_JSON secret"
            exit 0
          fi

          GRADLE_FILE=$(ls app/build.gradle.kts app/build.gradle 2>/dev/null | head -n1)
          APP_ID=$(grep -oP 'applicationId\s*=?\s*"\K[^"]+' "$GRADLE_FILE" | head -n1)
          SUFFIX=$(grep -oP 'applicationIdSuffix\s*=?\s*"\K[^"]+' "$GRADLE_FILE" | head -n1 || true)
          if [ -z "$APP_ID" ]; then
            echo "::error::applicationId를 $GRADLE_FILE 에서 찾지 못함"
            exit 1
          fi
          echo "applicationId=$APP_ID suffix=$SUFFIX"

          python3 - "$APP_ID" "$SUFFIX" > app/google-services.json <<'PY'
          import json, sys
          app_id, suffix = sys.argv[1], sys.argv[2]
          pkgs = [app_id] + ([app_id + suffix] if suffix else [])
          clients = []
          for i, p in enumerate(pkgs):
              clients.append({
                  "client_info": {
                      "mobilesdk_app_id": f"1:000000000000:android:{i:016x}",
                      "android_client_info": {"package_name": p},
                  },
                  "oauth_client": [],
                  "api_key": [{"current_key": "AIzaSyDummyKeyForCiBuildOnly000000000"}],
                  "services": {"appinvite_service": {"other_platform_oauth_client": []}},
              })
          print(json.dumps({
              "project_info": {
                  "project_number": "000000000000",
                  "project_id": "dummy-ci-project",
                  "storage_bucket": "dummy-ci-project.appspot.com",
              },
              "client": clients,
              "configuration_version": "1",
          }, indent=2))
          PY
          cat app/google-services.json

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          find . -path "*/build/outputs/apk/*/debug/*.apk" -exec cp {} out/ \;
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: out/*.apk
          if-no-files-found: error
